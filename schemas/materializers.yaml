version: 1
materializers:
  - name: "catalog"
    input: "Curated product/provider/model/MCP metadata"
    output: "Catalog entities and aliases"
    idempotency_key: "catalog object/version"
    trigger: "On catalog release"
    freshness_target: "<5 min"
    storage: "PostgreSQL + search"
    owner: "catalog domain team with platform data-contract stewardship"
    retry: exponential_with_jitter
    dead_letter: required
    replay: versioned_and_tenant_scoped
    backfill: uses_same_contract_with_backfill_run_id_and_watermark
    tenant_isolation: required_on_every_key_partition_and_query
    schema_versioning: input_and_output_versions_are_persisted
    failure_behavior: preserve_last_good_projection_and_surface_lag_or_partial_state
    observability: "input/output rate, oldest pending, watermark lag, retries, DLQ, reconciliation drift, schema versions"
  - name: "identity"
    input: "Identity/Persona/connector observations"
    output: "Users, accounts, groups, identities"
    idempotency_key: "tenant + source + native ID + version"
