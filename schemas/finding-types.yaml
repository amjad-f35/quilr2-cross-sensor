    required_sources: "IdP/HR/connector"
    evidence: "agent.run.started"
    dedup_key: "deployment+observed identity"
    action: "Stop deployment or correct binding"
    availability: "Requires external integration"
    mvs: "Later"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Shared credential used by several agents"
    category: "Identity"
    condition: "Same credential fingerprint used by multiple unrelated agents"
