    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "Browser/BES"
    evidence: "ai.application.used"
    dedup_key: "entity+adoption window"
    action: "Approve, restrict, or migrate"
    availability: "Derivable now"
    mvs: "Launch"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Personal account used for enterprise work"
    category: "Identity/Data"
    condition: "Enterprise actor/data activity tied to account classified personal with sufficient evidence"
    required_data: "Application Account; user; data class"
    required_relationships: "Application/Model/Tool ACCESSES|PROCESSES|READS|MODIFIES Data"
    required_sources: "Browser/BES; IdP/HR/connector; DLP/data catalog/provider"
    evidence: "account + prompt/upload activity"
    dedup_key: "account+root activity window"
    action: "Migrate to enterprise account; restrict personal use"
    availability: "Requires account telemetry/integration"
    mvs: "Next"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Agent operates without stable identity"
    category: "Identity"
    condition: "Agent activity cannot resolve to definition/deployment/workload identity"
