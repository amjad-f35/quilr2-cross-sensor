    required_relationships: "Policy APPLIES_TO entity; Policy ENFORCED_AT point; Decision GOVERNED_BY Policy; Agent RUNS_AS/ACTS_ON_BEHALF_OF; Human DELEGATED_TO Agent"
    required_sources: "Policy/authorization"
    evidence: "action + delegation"
    dedup_key: "agent+delegation+action scope"
    action: "Revoke action; narrow delegation"
    availability: "Requires authorization graph"
    mvs: "Later"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Agent delegation broader than required"
    category: "Authority"
