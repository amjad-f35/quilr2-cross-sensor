    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "Browser/BES; LLM Gateway/provider"
    evidence: "usage + cost"
    dedup_key: "capability cluster+period"
    action: "Consolidate products"
    availability: "Requires catalog and billing"
    mvs: "Later"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Unapproved application is widely adopted"
    category: "Governance"
    condition: "Unapproved app exceeds user/department threshold"
