    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "Canonical observation/event/relationship sources"
    evidence: "asset.retired + activity"
    dedup_key: "entity+retirement generation"
    action: "Disable access or reverse retirement"
    availability: "Derivable now"
    mvs: "Launch"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Asset has not been observed recently"
    category: "Lifecycle"
    condition: "All expected sources exceed entity/source freshness threshold"
