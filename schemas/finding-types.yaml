version: 1
finding_types:
  - name: "Unmanaged AI application discovered"
    category: "Discovery"
    condition: "Observed active tenant application has no management record"
    required_data: "Tenant Application; activity"
    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "Browser/BES"
    evidence: "asset/activity observations"
    dedup_key: "product+tenant application"
    action: "Assign owner; approve, restrict, or block"
    availability: "Available now"
    mvs: "Launch"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "New AI application appeared"
    category: "Discovery"
    condition: "First canonical discovery after baseline"
    required_data: "Tenant Application"
    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "Browser/BES"
    evidence: "asset.discovered"
    dedup_key: "entity+first-seen window"
    action: "Review product and management state"
    availability: "Derivable now"
    mvs: "Launch"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Unknown AI product or unresolved alias"
    category: "Discovery"
    condition: "Observation cannot resolve above review threshold"
    required_data: "Observation; candidate product"
    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "Canonical observation/event/relationship sources"
    evidence: "asset.observed"
    dedup_key: "normalized identifier cluster"
    action: "Map alias or create catalog candidate"
    availability: "Derivable now"
    mvs: "Launch"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Duplicate inventory entities likely represent same product"
    category: "Identity"
    condition: "Pair/cluster exceeds review threshold but not auto-merge threshold"
    required_data: "Canonical entities; observations"
    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "IdP/HR/connector"
    evidence: "resolution candidates"
    dedup_key: "ordered candidate entity IDs"
    action: "Merge or reject candidate"
    availability: "Derivable now"
    mvs: "Launch"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Canonical merge confidence is low"
    category: "Identity"
    condition: "Existing auto-merge confidence falls below policy after new/conflicting evidence"
    required_data: "Canonical entity; merge decision"
    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "IdP/HR/connector"
    evidence: "asset.merged/observation"
    dedup_key: "merge decision ID"
    action: "Review or split"
    availability: "MVS"
    mvs: "Launch"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Conflicting sensor identity information"
    category: "Identity"
    condition: "Authoritative fields disagree across valid observations"
    required_data: "Canonical entity"
    required_relationships: "Agent RUNS_AS/ACTS_ON_BEHALF_OF; Human DELEGATED_TO Agent"
    required_sources: "Endpoint; IdP/HR/connector"
    evidence: "asset.observed"
    dedup_key: "entity+field+conflict generation"
    action: "Select authority, correct catalog, or split"
    availability: "Derivable now"
    mvs: "Launch"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Application has no owner"
    category: "Management"
    condition: "Active/recent tenant application lacks valid owner relationship"
    required_data: "Tenant Application"
    required_relationships: "OWNED_BY"
    required_sources: "Browser/BES; IdP/HR/connector"
    evidence: "asset/ownership events"
    dedup_key: "entity+unowned generation"
    action: "Assign owner"
    availability: "Derivable now"
    mvs: "Launch"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Agent has no owner"
    category: "Management"
    condition: "Active agent lacks owner"
    required_data: "Agent Definition/Deployment"
    required_relationships: "OWNED_BY"
    required_sources: "IdP/HR/connector"
    evidence: "agent activity; ownership"
    dedup_key: "agent+unowned generation"
    action: "Assign team/owner"
    availability: "Requires stable agent identity"
    mvs: "Next"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Model deployment has no owner"
