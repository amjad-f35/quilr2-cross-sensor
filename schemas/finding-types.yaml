    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "Canonical observation/event/relationship sources"
    evidence: "asset.stale"
    dedup_key: "entity+stale generation"
    action: "Confirm retirement or repair coverage"
    availability: "Derivable now"
    mvs: "Launch"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Asset observed by only one low-confidence source"
    category: "Coverage"
    condition: "Active entity has one weak observation and no corroboration"
    required_data: "Canonical entity; sensor"
    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "Canonical observation/event/relationship sources"
    evidence: "asset.observed; sensor health"
    dedup_key: "entity+coverage window"
    action: "Verify identity/coverage"
    availability: "Derivable now"
    mvs: "Next"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Paid application has no observed usage"
    category: "Cost"
    condition: "Active paid subscription/account has no canonical activity in threshold window"
    required_data: "Subscription; tenant application"
    required_relationships: "Affected/root entity and supporting observation relationships"
    required_sources: "Browser/BES; LLM Gateway/provider"
    evidence: "billing + activity"
    dedup_key: "subscription+period"
    action: "Reclaim license"
    availability: "Requires external integration"
    mvs: "Next"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Duplicate applications provide same capability"
    category: "Cost"
    condition: "Managed products overlap capability and have redundant adoption/spend"
