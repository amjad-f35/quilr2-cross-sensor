    dedup_key: "deployment+unowned generation"
    action: "Assign owner/cost center"
    availability: "Derivable partly"
    mvs: "Next"
    reopen_on_recurrence: true
    tenant_scoped: true
  - name: "Asset remains active after retirement"
    category: "Lifecycle"
