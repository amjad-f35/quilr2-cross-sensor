name: DIE freeze validation

on:
  pull_request:
    paths:
      - ".github/workflows/die-freeze-validation.yml"
      - ".tool-versions"
      - "starliner-ga/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/die-freeze-validation.yml"
      - ".tool-versions"
      - "starliner-ga/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: die-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-clean-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: starliner-ga/passes/01-discovery-inventory-evidence/implementation-freeze/tools/requirements-test.lock

      - name: Install frozen validator dependencies
        run: >-
          python -m pip install
          --requirement
          starliner-ga/passes/01-discovery-inventory-evidence/implementation-freeze/tools/requirements-test.lock

      - name: Run one-command intrinsic validation
        env:
          DIE_VALIDATOR_PYTHON: python
          DIE_VALIDATION_EVIDENCE_DIR: ${{ runner.temp }}/die-static-evidence
        run: >-
          node
          starliner-ga/passes/01-discovery-inventory-evidence/implementation-freeze/tools/run-clean-room-validation.mjs
          --intrinsic

      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: die-static-validation-${{ github.sha }}
          path: ${{ runner.temp }}/die-static-evidence
          if-no-files-found: error
          retention-days: 30

  exact-engine-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Run exact PostgreSQL and ClickHouse smoke
        run: >-
          starliner-ga/passes/01-discovery-inventory-evidence/implementation-freeze/tools/run-live-storage-conformance.sh
