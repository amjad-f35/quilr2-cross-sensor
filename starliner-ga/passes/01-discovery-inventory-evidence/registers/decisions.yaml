schema_version: "1.0"
authority: "Discovery, Inventory, and Evidence Pass"
approval_state: "Frozen implementation authority; complete bounded product construction and integration authorized; human approval applies to release promotion and customer claims."
decisions:
  - id: DIE-ADR-001
    status: accepted
    decision: "The bounded product ships discovery, canonical inventory, evidence/activity, coverage, provenance, APIs and UI before findings and policy, while preserving a stable seam for a separate migration track."
    consequence: "Later intelligence consumes this pass; it cannot be a dependency of DIE-GA."
  - id: DIE-ADR-002
    status: accepted
    decision: "Browser, Browser Backend, Endpoint, LLM Gateway, and MCP Gateway are all launch evidence profiles; Browser Backend remains a distinct producer."
    consequence: "MCP is not deferred from the evidence/inventory pass, and browser relay facts retain lineage."
  - id: DIE-ADR-003
    status: accepted
    decision: "Full evidence means all supported, certified, privacy-approved typed facts plus explicit gaps and capture dispositions; it does not mean raw content."
    consequence: "Prompt, response, file, DOM, tool content, credentials, and prohibited fields are excluded."
  - id: DIE-ADR-004
    status: accepted
    decision: "Only the central resolver assigns canonical identity."
    consequence: "Endpoint application IDs, MCP deterministic IDs, and Quilr 1 IDs remain source or compatibility aliases."
  - id: DIE-ADR-005
    status: accepted
    decision: "The pass uses one modular backend codebase and release authority with role-specific ingest, normalizer, truth, projector, API and maintenance deployments, plus the separate web deployment."
    consequence: "Logical modules do not become one microservice per domain or materializer; role-specific images retain independent digests, rollout and scaling authority."
  - id: DIE-ADR-006
    status: accepted
    decision: "The minimum pass storage set is PostgreSQL, encrypted object storage, and ClickHouse."
    consequence: "Graph, external search, Redis, workflow, and policy stores require later measured justification."
  - id: DIE-ADR-007
    status: accepted
    decision: "PostgreSQL evidence inbox, leased work partitions, canonical transactional outbox, and projection checkpoints are the baseline durable work mechanism."
    consequence: "A separate event broker requires an ADR and capacity proof; it cannot become authority."
  - id: DIE-ADR-008
    status: accepted
    decision: "PostgreSQL owns canonical inventory, relationship, activity, coverage, audit, control state and ordinary product read models; a future migration track may add separately governed compatibility state."
    consequence: "ClickHouse owns only rebuildable high-volume activity/evidence search and bounded aggregates."
  - id: DIE-ADR-009
    status: accepted
    decision: "Overview and inventory use PostgreSQL read models; activity search uses ClickHouse; evidence detail uses PostgreSQL/object references."
    consequence: "The product API cannot dynamically reconstruct truth from several source systems."
  - id: DIE-ADR-010
    status: accepted
    decision: "Important events are explicit source/canonical event families, not risk-scored findings."
    consequence: "The pass may filter discovery, lifecycle, activity, native decisions/effects, gaps, and corrections without shipping intelligence."
  - id: DIE-ADR-011
    status: accepted
    decision: "Existing source-native policy, DLP, block, warning, confirmation, and effect records are displayed only as observed native evidence."
    consequence: "The UI cannot claim Quilr 2 policy or remediation capability."
  - id: DIE-ADR-012
    status: accepted
    decision: "Coverage and capture state accompany every completeness, absence, active-use, and freshness statement."
    consequence: "Unknown or degraded coverage cannot be shown as zero usage or retirement."
  - id: DIE-ADR-013
    status: accepted
    decision: "The pass UI navigation is Overview, Inventory, Activity & Evidence, and Sources & Coverage, with permissioned operational surfaces."
    consequence: "Insights, Cases, Analytics/Cost, and Policies are not empty navigation."
  - id: DIE-ADR-014
    status: deferred_parallel
    decision: "Quilr 1 remains customer read authority through dark/backfill/shadow phases and remains available during cohort stabilization."
    consequence: "No big-bang rewrite, frontend mashup, or destructive rollback is allowed."
  - id: DIE-ADR-015
    status: deferred_parallel
    decision: "Quilr 1 imports are immutable legacy evidence and compatibility mappings."
    consequence: "Legacy composite rows are re-resolved and do not dictate canonical ontology."
  - id: DIE-ADR-016
    status: deferred_parallel
    decision: "Semantic parity compares member identity, lifecycle, relationships, activity, authorization, exports, and coverage under matched watermarks."
    consequence: "Equal aggregate counts are insufficient."
  - id: DIE-ADR-017
    status: accepted
    decision: "Projection rebuilds use candidate namespaces, catch-up, validation, impact diff, atomic promotion, and rollback retention."
    consequence: "Active product state is never cleared in place."
  - id: DIE-ADR-018
    status: accepted
    decision: "DIE-GA is a separate release gate before broader G2/G3 intelligence and governance promises."
    consequence: "The pass can ship trustworthy facts without findings, workflows, policy, or Quilr 1 retirement."
  - id: DIE-ADR-019
    status: accepted
    decision: "quilrbusiness/project-starliner is the core backend repository for the pass; the exact-source fit-gap audit is complete and implementation follows the frozen module disposition."
    consequence: "The program evolves one verified spine, does not create a competing core backend, and classifies existing code as retain, harden, refactor, compatibility-only, replace, delete-later, missing, or unresolved."
  - id: DIE-ADR-020
    status: accepted
    decision: "The all-five-profile architecture remains globally frozen while product integration advances by exact-artifact Gate-A source verticals: Endpoint then Browser and an immediate cross-source graph/negative proof, then Browser Backend, LLM and MCP; Gate-B route breadth closes in parallel and remains mandatory before release."
    consequence: "The team neither builds five disconnected adapters first nor delays the defining cross-sensor graph behind one sensor's long-tail route surface."
