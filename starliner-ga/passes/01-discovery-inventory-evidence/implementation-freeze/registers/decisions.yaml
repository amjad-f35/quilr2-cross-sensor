    decision: control and inventory truth activity-only processing and bulk replay use separately budgeted partition-key lanes; lane classification is central mixed normalization bundles remain atomic in inventory and activity has no tenant-global or platform-global serialization lock
    status: frozen
  - id: DIE-RESOLVER-001
    area: resolver_framework
    decision: one central deterministic resolver framework dispatches through a versioned canonical-entity-type registry to type-specific resolver modules with exact keys negative constraints authority rules bounds digests and fixtures; missing modules never fall through to global fuzzy matching
    status: frozen
  - id: DIE-RELEASE-001
    area: role_artifact_and_compatibility
    decision: one repository and signed platform-release manifest bind independently built role image digests SBOMs provenance contract ranges and generated clients; roles can canary and rollback independently only within declared N/N-1 protocol work-contract and database-schema compatibility
    status: frozen
