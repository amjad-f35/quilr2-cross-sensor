      "coverage_dependency": "Gateway route and persistence path healthy; unsensed bypass traffic excluded",
      "product_card": "Analytics",
      "drill_down": "Filtered api_request_log/Axis/probe evidence"
    },
    {
      "metric": "upstream_latency_ms",
      "existing_derived_proposed": "Existing",
      "formula": "sum of timed upstream legs",
      "unit": "milliseconds",
      "dimensions": "provider, model",
      "source_events": "PerformanceLoggerAsync",
      "coverage_dependency": "Gateway route and persistence path healthy; unsensed bypass traffic excluded",
      "product_card": "Analytics",
      "drill_down": "Filtered api_request_log/Axis/probe evidence"
    },
