{
  "metrics": [
    {
      "metric": "requests_total",
      "existing_derived_proposed": "Derived",
      "formula": "count(api_request_log)",
      "unit": "requests",
      "dimensions": "tenant, app/key, provider, model, status, user, time",
      "source_events": "api_request_log",
      "coverage_dependency": "Gateway route and persistence path healthy; unsensed bypass traffic excluded",
      "product_card": "Analytics",
      "drill_down": "Filtered api_request_log/Axis/probe evidence"
    },
    {
      "metric": "request_success_rate",
      "existing_derived_proposed": "Derived",
      "formula": "count(success)/count(all)",
      "unit": "ratio",
      "dimensions": "provider, model, tenant, time",
      "source_events": "status_code",
      "coverage_dependency": "Gateway route and persistence path healthy; unsensed bypass traffic excluded",
      "product_card": "Analytics",
      "drill_down": "Filtered api_request_log/Axis/probe evidence"
    },
    {
      "metric": "request_error_rate",
      "existing_derived_proposed": "Derived",
      "formula": "count(error)/count(all)",
      "unit": "ratio",
      "dimensions": "provider, model, error_type, time",
      "source_events": "status_code/error_type",
      "coverage_dependency": "Gateway route and persistence path healthy; unsensed bypass traffic excluded",
      "product_card": "Analytics",
      "drill_down": "Filtered api_request_log/Axis/probe evidence"
    },
    {
      "metric": "total_latency_ms",
      "existing_derived_proposed": "Existing",
      "formula": "persisted elapsed wall time",
      "unit": "milliseconds",
      "dimensions": "provider, model, endpoint",
