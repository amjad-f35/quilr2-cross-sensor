      operationId: createExport
      x-quilr-capability: export.create
      tags: [Exports]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '202':
          description: Export job accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/ExportJob'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listExports
      x-quilr-capability: export.read
      tags: [Exports]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Authorized export jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ExportJob'}
        default: {$ref: '#/components/responses/Problem'}
  /exports/{export_id}:
    get:
      operationId: getExport
      x-quilr-capability: export.read
      tags: [Exports]
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Export state and authorized download grant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/ExportJob'}
        default: {$ref: '#/components/responses/Problem'}
  /exports/{export_id}/content:
    get:
      operationId: downloadExport
      x-quilr-capability: export.download
      tags: [Exports]
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Authenticated export stream. Authorization revision, job state and expiry are rechecked at redemption; this endpoint never exposes a durable object-store URL.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}
  /authorization/scopes:
    get:
      operationId: listAuthorizationScopes
      x-quilr-capability: authz.admin
      tags: [Authorization]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Authorized business-scope page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/AuthorizationScope'}
        default: {$ref: '#/components/responses/Problem'}
  /authorization/role-bindings:
    get:
      operationId: listRoleBindings
      x-quilr-capability: authz.admin
      tags: [Authorization]
      parameters:
        - name: subject_id
          in: query
          schema: {type: string}
        - name: role
          in: query
          schema: {type: array, items: {type: string}}
        - name: scope_id
          in: query
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Authorized role-binding page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/RoleBinding'}
        default: {$ref: '#/components/responses/Problem'}
  /authorization/relation-tuples:
    get:
      operationId: listRelationTuples
      x-quilr-capability: authz.admin
      tags: [Authorization]
      parameters:
        - name: subject_id
          in: query
          schema: {type: string}
        - name: relation
          in: query
          schema: {type: array, items: {type: string}}
        - name: resource_type
          in: query
          schema: {type: string}
        - name: resource_id
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Authorized curated relation page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/RelationTuple'}
        default: {$ref: '#/components/responses/Problem'}
  /authorization/actions:preview:
    post:
      operationId: previewAuthorizationAction
      x-quilr-capability: authz.admin
      tags: [Authorization]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationActionRequest'}
      responses:
        '200':
          description: Authorization change impact preview.
          headers:
            ETag:
              description: Opaque server-generated authorization preview revision token required by commit.
              schema:
                type: string
                pattern: '^"die-authz:[A-Za-z0-9._:-]{1,220}"$'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/AuthorizationActionPreview'}
        default: {$ref: '#/components/responses/Problem'}
  /authorization/actions:
    post:
      operationId: commitAuthorizationAction
      x-quilr-capability: authz.admin
      tags: [Authorization]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationActionCommit'}
      responses:
        '200':
          description: Atomic authorization change result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/AuthorizationActionResult'}
        default: {$ref: '#/components/responses/Problem'}
  /audit/events:
    get:
      operationId: listAuditEvents
      x-quilr-capability: audit.read
      tags: [Audit]
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: actor_id
          in: query
          schema: {type: string}
        - name: action
          in: query
          schema: {type: array, items: {type: string}}
        - name: resource_type
          in: query
          schema: {type: array, items: {type: string}}
        - name: outcome
          in: query
          schema: {type: array, items: {type: string, enum: [succeeded, denied, failed]}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ActivityPageSize'
      responses:
        '200':
          description: Authorized audit-event page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/AuditEvent'}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Scope:
      name: scope_id
      in: query
      schema: {$ref: '#/components/schemas/OpaqueId'}
    From:
      name: from
      in: query
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      schema: {type: string, format: date-time}
    FromRequired:
      name: from
      in: query
      required: true
      schema: {type: string, format: date-time}
    ToRequired:
      name: to
      in: query
      required: true
      schema: {type: string, format: date-time}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 4096}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    ActivityPageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    Search:
      name: q
      in: query
      schema: {type: string, minLength: 1, maxLength: 256}
    EntityType:
      name: entity_type
      in: query
      schema:
        type: array
        items: {$ref: '#/components/schemas/EntityType'}
    Lifecycle:
      name: lifecycle
      in: query
      schema:
        type: array
        items: {$ref: '#/components/schemas/EntityLifecycle'}
    Environment:
      name: environment
      in: query
      schema: {type: array, items: {type: string}}
    EntityId:
      name: entity_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueId'}
    AgentDeploymentId:
      name: agent_deployment_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueId'}
    ActivityId:
      name: activity_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueId'}
    EvidenceId:
      name: evidence_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueId'}
    AccessId:
      name: access_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueId'}
    ProducerId:
      name: producer_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueId'}
    ExportId:
      name: export_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueId'}
    CommandId:
      name: command_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueId'}
    Consistency:
      name: consistency
      in: query
      schema: {type: string, enum: [projection, canonical], default: projection}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
        pattern: '^"die-(?:identity|authz):[A-Za-z0-9._:-]{1,220}"$'
  responses:
    Problem:
      description: Problem response.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    OpaqueId:
      type: string
      pattern: '^[a-z][a-z0-9_]*_[A-Za-z0-9_-]{16,128}$'
    EntityType:
      type: string
      enum:
        - application_product
        - application_surface
        - application_deployment
        - application_account
        - agent_definition
        - agent_deployment
        - agent_hook
        - agent_skill
        - agent_plugin
        - configured_permission_rule
        - repository
        - model_product
        - model_family
        - model_version
        - model_deployment
        - model_route
        - provider_account
        - mcp_server_product
        - mcp_server_deployment
        - mcp_tool
        - mcp_resource_definition
        - mcp_prompt_definition
        - person
        - directory_account
        - service_principal
        - team
        - business_unit
        - device
        - browser_installation
        - endpoint_installation
        - llm_gateway_deployment
        - mcp_gateway_deployment
        - browser_backend_deployment
        - workload
        - workload_identity
        - provider
        - source_producer
        - source_object
        - session
        - resource
        - artifact_or_package
        - unknown
    EntityLifecycle:
      type: string
      enum: [active, inactive, stale, retired, ambiguous, unknown]
    CoverageState:
      type: string
      enum: [covered, degraded, gap, unsupported, unknown]
    CaptureState:
      type: string
      enum: [complete, minimized, redacted, metadata_only, unsupported, unknown]
    FieldClassification:
      type: string
      enum: [public_product, internal, sensitive_metadata, restricted_evidence]
    Outcome:
      type: string
      enum: [succeeded, failed, blocked, cancelled, timed_out, unknown]
    SafeScalar:
      oneOf:
        - {type: string, maxLength: 4096}
        - {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
        - {type: number, minimum: -9007199254740991, maximum: 9007199254740991, not: {multipleOf: 1}}
        - {type: boolean}
        - {type: 'null'}
    SafeScalarArray:
      type: array
      maxItems: 128
      items: {$ref: '#/components/schemas/SafeScalar'}
    SafeAttributeMap:
      type: object
      maxProperties: 128
      propertyNames: {pattern: '^[A-Za-z0-9_.:-]{1,128}$'}
      additionalProperties:
        oneOf:
          - {$ref: '#/components/schemas/SafeScalar'}
          - {$ref: '#/components/schemas/SafeScalarArray'}
    SafeAttributeValue:
      oneOf:
        - {$ref: '#/components/schemas/SafeScalar'}
        - {$ref: '#/components/schemas/SafeScalarArray'}
        - {$ref: '#/components/schemas/SafeAttributeMap'}
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id, generated_at, canonical_watermark, projection_watermark, projection_generation, authorization_revision, coverage_state, freshness, partial, warnings]
      properties:
        request_id: {type: string}
        generated_at: {type: string, format: date-time}
        canonical_watermark: {type: integer, minimum: 0, maximum: 9007199254740991}
        projection_watermark: {type: integer, minimum: 0, maximum: 9007199254740991}
        projection_generation: {type: integer, minimum: 1, maximum: 9007199254740991}
        authorization_revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        coverage_state: {$ref: '#/components/schemas/CoverageState'}
        freshness: {$ref: '#/components/schemas/Freshness'}
        partial: {type: boolean}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Warning'}
    Freshness:
      type: object
      additionalProperties: false
      required: [canonical_lag_ms, projection_lag_ms]
      properties:
        source_lag_ms: {type: integer, minimum: 0, maximum: 9007199254740991}
        canonical_lag_ms: {type: integer, minimum: 0, maximum: 9007199254740991}
        projection_lag_ms: {type: integer, minimum: 0, maximum: 9007199254740991}
    Warning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        source_profile: {type: string}
    BaseResponse:
      type: object
      required: [meta]
      properties:
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    Page:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        next_cursor: {type: [string, 'null'], maxLength: 4096}
        has_more: {type: boolean}
        exact_total: {type: [integer, 'null'], minimum: 0, maximum: 9007199254740991}
    PagedResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required: [page]
          properties:
            page: {$ref: '#/components/schemas/Page'}
    OverviewResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/Overview'}
    Overview:
      type: object
      additionalProperties: false
      required: [entity_counts, lifecycle_counts, activity_counts, coverage, recent_changes]
      properties:
        entity_counts:
          type: object
          additionalProperties: {type: integer, minimum: 0, maximum: 9007199254740991}
        lifecycle_counts:
          type: object
          additionalProperties: {type: integer, minimum: 0, maximum: 9007199254740991}
        activity_counts:
          type: object
          additionalProperties: {type: integer, minimum: 0, maximum: 9007199254740991}
        coverage: {$ref: '#/components/schemas/CoverageSummary'}
        recent_changes:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/ChangeSummary'}
        ambiguity_count: {type: integer, minimum: 0, maximum: 9007199254740991}
    ChangeSummary:
      type: object
      additionalProperties: false
      required: [change_id, change_type, occurred_at, summary, entity_ids]
      properties:
        change_id: {$ref: '#/components/schemas/OpaqueId'}
        change_type: {type: string, enum: [discovered, changed, stale, retired, relationship_started, relationship_ended, coverage_changed, identity_ambiguous, unknown]}
        occurred_at: {type: string, format: date-time}
        summary: {type: string}
        entity_ids: {type: array, items: {$ref: '#/components/schemas/OpaqueId'}}
    EntitySummary:
      type: object
      additionalProperties: false
      required: [entity_id, entity_type, canonical_version, display_name, canonical_name, lifecycle, business_scope_id, first_observed_at, last_observed_at, source_count, relationship_count, ambiguity_state, coverage_state]
      properties:
        entity_id: {$ref: '#/components/schemas/OpaqueId'}
        entity_type: {$ref: '#/components/schemas/EntityType'}
        canonical_version: {type: integer, minimum: 1, maximum: 9007199254740991}
        display_name: {type: string}
        canonical_name: {type: string}
        vendor: {type: [string, 'null']}
        lifecycle: {$ref: '#/components/schemas/EntityLifecycle'}
        owner: {$ref: '#/components/schemas/EntityRef'}
        business_scope_id: {$ref: '#/components/schemas/OpaqueId'}
        environment: {type: [string, 'null']}
        first_observed_at: {type: string, format: date-time}
        last_observed_at: {type: string, format: date-time}
        source_count: {type: integer, minimum: 0, maximum: 9007199254740991}
        relationship_count: {type: integer, minimum: 0, maximum: 9007199254740991}
        recent_activity_at: {type: [string, 'null'], format: date-time}
        ambiguity_state: {type: string}
        coverage_state: {$ref: '#/components/schemas/CoverageState'}
        safe_summary: {$ref: '#/components/schemas/SafeAttributeMap'}
        field_redactions: {type: array, items: {type: string}}
    EntityRef:
      type: object
      additionalProperties: false
      required: [entity_id, entity_type, display_name]
      properties:
        entity_id: {$ref: '#/components/schemas/OpaqueId'}
        entity_type: {$ref: '#/components/schemas/EntityType'}
        display_name: {type: string}
    EntityDetail:
      type: object
      additionalProperties: false
      required: [summary, attributes, field_provenance, relationship_summary, recent_activity, source_summary]
      properties:
        summary: {$ref: '#/components/schemas/EntitySummary'}
        attributes: {$ref: '#/components/schemas/SafeAttributeMap'}
        field_provenance:
          type: array
          items: {$ref: '#/components/schemas/FieldProvenance'}
        relationship_summary:
          type: array
          items: {$ref: '#/components/schemas/RelationshipCount'}
        recent_activity:
          type: array
          items: {$ref: '#/components/schemas/ActivitySummary'}
        source_summary:
          type: array
          items: {$ref: '#/components/schemas/SourceObservationSummary'}
    AgentDeploymentSummary:
      type: object
      additionalProperties: false
      required:
        - agent_deployment
        - agent_definition
        - deployment_locality
        - lifecycle
        - first_observed_at
        - last_observed_at
