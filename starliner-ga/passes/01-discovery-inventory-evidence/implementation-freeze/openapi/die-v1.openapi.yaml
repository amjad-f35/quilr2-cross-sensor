        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityActionCommit'}
      responses:
        '202':
          description: Identity correction command durably accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/IdentityCommand'}
        default: {$ref: '#/components/responses/Problem'}
  /identity/actions/{command_id}:
    get:
      operationId: getIdentityAction
      x-quilr-capability: identity.review
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/CommandId'
