openapi: 3.1.0
info:
  title: Quilr Discovery, Inventory and Evidence API
  version: 1.0.0
  description: Canonical customer API for the frozen DIE pass.
servers:
  - url: /die/v1
security:
  - bearerAuth: []
tags:
  - name: Overview
  - name: Inventory
  - name: Activity
  - name: Evidence
  - name: Coverage
  - name: Producers
  - name: Identity
  - name: Authorization
  - name: Exports
  - name: Audit

paths:
  /overview:
    get:
      operationId: getOverview
      x-quilr-capability: overview.read
      tags: [Overview]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Authorized canonical overview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverviewResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /overview/changes:
    get:
      operationId: listOverviewChanges
      x-quilr-capability: overview.read
      tags: [Overview]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Recent canonical changes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ChangeSummary'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/entities:
    get:
      operationId: listEntities
      x-quilr-capability: inventory.list
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/Lifecycle'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_observed_at_desc, display_name_asc, first_observed_at_desc]
            default: last_observed_at_desc
      responses:
        '200':
          description: Authorized canonical entities.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/EntitySummary'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/entities/{entity_id}:
    get:
      operationId: getEntity
      x-quilr-capability: inventory.read
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Canonical entity and permitted provenance.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/EntityDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/entities/{entity_id}/relationships:
    get:
      operationId: listEntityRelationships
      x-quilr-capability: relationship.read
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - name: direction
          in: query
          schema: {type: string, enum: [in, out, both], default: both}
        - name: predicate
          in: query
          schema: {type: array, items: {type: string}}
        - name: semantic
          in: query
          schema:
            type: array
            items: {type: string, enum: [structural, configured, entitlement, observed, ownership, coverage]}
        - name: hops
          in: query
          schema: {type: integer, minimum: 1, maximum: 2, default: 1}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Bounded authorized relationship page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items, authorization_filtered]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Relationship'}
                      authorization_filtered: {type: boolean}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/agent-deployments:
    get:
      operationId: listAgentDeployments
      x-quilr-capability: inventory.list
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Lifecycle'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/Search'
        - name: locality
          in: query
          schema: {type: array, items: {type: string, enum: [local, remote, cloud, gateway, unknown]}}
        - name: device_id
          in: query
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - name: observed_user_id
          in: query
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - name: execution_identity_id
          in: query
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - name: agent_definition_id
          in: query
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Deployment-scoped agent assets. A local row represents one exact agent definition, device and source-authority installation/configuration scope; observed user and exact execution identity are separate evidence-backed fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/AgentDeploymentSummary'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/agent-deployments/{agent_deployment_id}:
    get:
      operationId: getAgentDeployment
      x-quilr-capability: inventory.read
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/AgentDeploymentId'
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Hydrated agent asset detail with device, observation identity, independently proved execution identity, workload and configured MCP context.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/AgentDeploymentDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/agent-deployments/{agent_deployment_id}/exposure-paths:
    get:
      operationId: listAgentExposurePaths
      x-quilr-capability: relationship.read
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/AgentDeploymentId'
        - name: evidence_class
          in: query
          schema: {type: array, items: {type: string, enum: [configured, entitlement, observed]}}
        - name: max_hops
          in: query
          schema: {type: integer, minimum: 1, maximum: 4, default: 3}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Allowlisted, bounded, evidence-backed paths. This endpoint never infers entitlement merely because an agent runs with a user account.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items, entitlement_coverage]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ExposurePath'}
                      entitlement_coverage: {$ref: '#/components/schemas/CoverageState'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/applications:
    get:
      operationId: listApplications
      x-quilr-capability: inventory.list
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Lifecycle'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/Search'
        - name: technology_class
          in: query
          schema: {type: array, items: {type: string, enum: [generative_ai, other_ai, non_ai, unknown]}}
        - name: agentic_capability
          in: query
          schema: {type: array, items: {type: string, enum: [present, absent, unknown]}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Product-rooted application rollups; an unresolved surface or deployment remains its own source-scoped rollup.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/ApplicationSummary'}}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/applications/{entity_id}:
    get:
      operationId: getApplication
      x-quilr-capability: inventory.read
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Hydrated application rollup with surfaces, deployments, account context, configuration, activity and evidence.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/ApplicationDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/models:
    get:
      operationId: listModels
      x-quilr-capability: inventory.list
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Lifecycle'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Model assets at the strongest provider/source layer actually supported by evidence.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/ModelSummary'}}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/models/{entity_id}:
    get:
      operationId: getModel
      x-quilr-capability: inventory.read
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Hydrated model asset without promoting Endpoint configuration into provider version/deployment truth.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/ModelDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/mcp-servers:
    get:
      operationId: listMcpServers
      x-quilr-capability: inventory.list
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Lifecycle'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/Search'
        - name: locality
          in: query
          schema: {type: array, items: {type: string, enum: [local, remote, gateway, unknown]}}
        - name: capability_scope_state
          in: query
          description: Filter by the disclosed assurance of the capability view; this never accepts or returns an authorization-context token.
          schema: {type: array, items: {$ref: '#/components/schemas/McpCapabilityScopeState'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: MCP deployment inventory. Endpoint and Gateway deployments remain separate without exact binding; capability counts are scoped and never unioned across authorization contexts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/McpServerSummary'}}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/mcp-servers/{entity_id}:
    get:
      operationId: getMcpServer
      x-quilr-capability: inventory.read
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Hydrated MCP deployment with capability definitions only where the owning source actually provides them, including safe capability-scope and freshness disclosure without source scope tokens.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/McpServerDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/devices:
    get:
      operationId: listDevices
      x-quilr-capability: inventory.list
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Lifecycle'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Sensor-observed device context; this is not complete MDM inventory.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/DeviceSummary'}}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/devices/{entity_id}:
    get:
      operationId: getDevice
      x-quilr-capability: inventory.read
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Hydrated sensor-observed device with installations, applications, agents and identity context.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/DeviceDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/identities:
    get:
      operationId: listIdentities
      x-quilr-capability: inventory.list
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Lifecycle'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Source-scoped and resolved observed identities; this is not a complete enterprise directory.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/IdentitySummary'}}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/identities/{entity_id}:
    get:
      operationId: getIdentity
      x-quilr-capability: inventory.read
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Hydrated observed identity with assurance, conflicts and evidence-backed relationships.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/IdentityDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/entities/{entity_id}/sources:
    get:
      operationId: listEntitySources
      x-quilr-capability: inventory.read
      tags: [Inventory]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Source observations supporting the entity.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/SourceObservationSummary'}
        default: {$ref: '#/components/responses/Problem'}
  /inventory/entities/{entity_id}/identity:
    get:
      operationId: explainEntityIdentity
      x-quilr-capability: identity.read
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Authorized identity resolution explanation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/IdentityExplanation'}
        default: {$ref: '#/components/responses/Problem'}
  /activity:
    get:
      operationId: listActivity
      x-quilr-capability: activity.read
      tags: [Activity]
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - $ref: '#/components/parameters/Scope'
        - name: family
          in: query
          schema:
            type: array
            items: {type: string, enum: [application, agent, workload, session, model, mcp, tool, network, resource, source, native_control]}
        - name: subtype
          in: query
          schema: {type: array, items: {type: string}}
        - name: actor_entity_id
          in: query
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - name: resource_entity_id
          in: query
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - name: outcome
          in: query
          schema:
            type: array
            items: {$ref: '#/components/schemas/Outcome'}
        - name: source_profile
          in: query
          schema: {type: array, items: {type: string}}
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ActivityPageSize'
      responses:
        '200':
          description: Authorized canonical activity page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ActivitySummary'}
        default: {$ref: '#/components/responses/Problem'}
  /activity/{activity_id}:
    get:
      operationId: getActivity
      x-quilr-capability: activity.read
      tags: [Activity]
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: Canonical activity detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/ActivityDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /evidence:
    get:
      operationId: listEvidence
      x-quilr-capability: evidence.metadata.read
      tags: [Evidence]
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: producer_id
          in: query
          schema: {$ref: '#/components/schemas/OpaqueId'}
        - name: source_profile
          in: query
          schema: {type: array, items: {type: string}}
        - name: record_type
          in: query
          schema: {type: array, items: {type: string}}
        - name: capture_state
          in: query
          schema: {type: array, items: {$ref: '#/components/schemas/CaptureState'}}
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ActivityPageSize'
      responses:
        '200':
          description: Safe evidence metadata page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/EvidenceMetadata'}
        default: {$ref: '#/components/responses/Problem'}
  /evidence/{evidence_id}:
    get:
      operationId: getEvidence
      x-quilr-capability: evidence.metadata.read
      tags: [Evidence]
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Safe evidence metadata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/EvidenceMetadata'}
        default: {$ref: '#/components/responses/Problem'}
  /evidence/{evidence_id}/lineage:
    get:
      operationId: getEvidenceLineage
      x-quilr-capability: evidence.metadata.read
      tags: [Evidence]
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Evidence-to-normalized-to-canonical lineage.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/EvidenceLineage'}
        default: {$ref: '#/components/responses/Problem'}
  /evidence/{evidence_id}/content-access:
    post:
      operationId: createEvidenceContentAccess
      x-quilr-capability: evidence.object.read
      tags: [Evidence]
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentAccessRequest'}
      responses:
        '201':
          description: Single-use, short-lived access grant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/ContentAccessGrant'}
        default: {$ref: '#/components/responses/Problem'}
  /evidence-content-access/{access_id}:
    get:
      operationId: redeemEvidenceContentAccess
      x-quilr-capability: evidence.object.read
      tags: [Evidence]
      parameters:
        - $ref: '#/components/parameters/AccessId'
      responses:
        '200':
          description: One-time authenticated evidence byte stream. Redemption atomically consumes the access grant before bytes are returned.
          headers:
            Cache-Control:
              schema: {type: string, const: 'no-store, private'}
            X-Content-Type-Options:
              schema: {type: string, const: nosniff}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '410':
          description: Grant expired, revoked or already consumed.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /coverage:
    get:
      operationId: listCoverage
      x-quilr-capability: coverage.read
      tags: [Coverage]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: state
          in: query
          schema: {type: array, items: {$ref: '#/components/schemas/CoverageState'}}
        - name: capability
          in: query
          schema: {type: array, items: {type: string}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Coverage interval page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/CoverageInterval'}
        default: {$ref: '#/components/responses/Problem'}
  /coverage/gaps:
    get:
      operationId: listCoverageGaps
      x-quilr-capability: coverage.read
      tags: [Coverage]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Active or historical gaps.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/CoverageGap'}
        default: {$ref: '#/components/responses/Problem'}
  /producers:
    get:
