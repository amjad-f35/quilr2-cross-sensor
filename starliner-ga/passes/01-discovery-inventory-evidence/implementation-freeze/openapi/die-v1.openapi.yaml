          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    required: [data]
                    properties:
                      data: {$ref: '#/components/schemas/IdentityCommand'}
        default: {$ref: '#/components/responses/Problem'}
  /exports:
